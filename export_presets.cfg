[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/generated-palette/manifest.json"
exclude_filter="server/*,web/*,docs/*,tools/*,art-direction/*,*.md,*-preview.png,preview.png,assets/*/*-source.png,assets/*/*-prompts.json"
export_path="../release/FiveLaneLords/FiveLaneLords.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="res://.runtime/windows-templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.ico"
application/file_version="0.5.0"
application/product_version="0.5.0"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Web (itch.io)"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/generated-palette/manifest.json"
exclude_filter="server/*,web/*,docs/*,tools/*,art-direction/*,*.md,*-preview.png,preview.png,assets/*/*-source.png,assets/*/*-prompts.json"
export_path="../release/web/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/itch_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
